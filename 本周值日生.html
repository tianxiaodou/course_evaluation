<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周值日 · 双排班表</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f8f9fc 0%, #e6e9f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 1rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 2rem 1.8rem;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 30, 0.35),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #1e2b3c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        h1 span {
            background: #2c3e50;
            color: white;
            font-size: 1rem;
            font-weight: 400;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            letter-spacing: 0.5px;
        }
        .subhead {
            color: #5b6f84;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            font-weight: 400;
            text-align: center;
            border-bottom: 1px dashed #b8c5d4;
            padding-bottom: 1rem;
        }

        /* 双排班网格 */
        .duty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 560px) {
            .duty-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        .duty-panel {
            background: #ffffffcc;
            border-radius: 2rem;
            padding: 1.5rem 1rem 1.2rem;
            box-shadow: 0 8px 18px -10px rgba(0, 20, 30, 0.2),
                        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .duty-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            background: #ecf1f7;
            padding: 0.35rem 1.4rem;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 0.8rem;
            letter-spacing: 0.3px;
        }
        .duty-name {
            font-size: 2.6rem;
            font-weight: 700;
            color: #1e3a5f;
            line-height: 1.2;
            margin: 0.2rem 0 0.6rem;
            word-break: break-word;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .week-label {
            font-size: 0.85rem;
            color: #4d6278;
            background: #ecf1f7;
            display: inline-block;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            margin-bottom: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            text-align: center;
        }
        .sequence {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.4rem 0.7rem;
            background: #f3f7fd;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            margin: 0.4rem 0 0.8rem;
            border: 1px solid #e2e9f2;
            width: 100%;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }
        .seq-item {
            font-size: 0.85rem;
            font-weight: 500;
            color: #2e4156;
            display: flex;
            align-items: center;
            gap: 0.1rem;
        }
        .seq-item.current {
            color: #0d6efd;
            font-weight: 700;
            position: relative;
        }
        .seq-item.current::after {
            content: "👈";
            font-size: 0.9rem;
            margin-left: 1px;
        }
        .arrow {
            color: #99aec2;
            font-size: 0.9rem;
            font-weight: 300;
        }
        .reset-area {
            margin-top: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }
        .reset-btn {
            background: #1e2b3c;
            border: none;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.7rem 1.4rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 15px -8px rgba(20, 40, 70, 0.4);
            letter-spacing: 0.3px;
            border: 1px solid #ffffff30;
            width: 100%;
        }
        .reset-btn:hover {
            background: #0f1a26;
            transform: scale(1.01);
            box-shadow: 0 12px 20px -8px rgba(20, 40, 70, 0.5);
        }
        .reset-btn:active {
            transform: scale(0.99);
        }
        .reset-icon {
            font-size: 1rem;
            line-height: 1;
        }
        .reset-hint {
            color: #617e9c;
            font-size: 0.75rem;
            background: #f0f5fb;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            display: inline-block;
            white-space: nowrap;
        }
        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #8ea1b5;
            letter-spacing: 0.3px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            📋 本周值日
            <span>双排班</span>
        </h1>
        <div class="subhead">按顺序循环 · 每周轮换 · 各自可重置</div>

        <!-- 双排班网格 -->
        <div class="duty-grid">
            <!-- 18楼值日 -->
            <div class="duty-panel">
                <div class="duty-title">🏢 18楼值日</div>
                <div class="duty-name" id="duty18Name">秦明明</div>
                <div class="week-label" id="weekLabel18">本周</div>
                <div class="sequence" id="sequence18"></div>
                <div class="reset-area">
                    <button class="reset-btn" id="resetBtn18">
                        <span class="reset-icon">↻</span> 重置18楼
                    </button>
                    <div class="reset-hint" id="resetHint18">基准: 秦明明</div>
                </div>
            </div>

            <!-- 女厕所值日 -->
            <div class="duty-panel">
                <div class="duty-title">🚺 女厕所值日</div>
                <div class="duty-name" id="dutyToiletName">宁梦婷</div>
                <div class="week-label" id="weekLabelToilet">本周</div>
                <div class="sequence" id="sequenceToilet"></div>
                <div class="reset-area">
                    <button class="reset-btn" id="resetBtnToilet">
                        <span class="reset-icon">↻</span> 重置女厕所
                    </button>
                    <div class="reset-hint" id="resetHintToilet">基准: 宁梦婷</div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            ⏱️ 基于真实日期计算 · 每周一自动轮换
        </div>
    </div>
    <script>
        (function() {
            // ---------- 配置：两类值日 ----------
            // 18楼值日：四人循环
            const NAMES_18 = ['秦明明', '田晓丹', '董玉涛', '李云云'];
            const DEFAULT_BASE_18 = '秦明明';

            // 女厕所值日：三人循环（按用户要求：宁梦婷 → 李云云 → 田晓丹）
            const NAMES_TOILET = ['宁梦婷', '李云云', '田晓丹'];
            const DEFAULT_BASE_TOILET = '宁梦婷';

            // ---------- 通用工具 ----------
            // 获取当前日期所在周的周一（周一为一周开始）
            function getMonday(date = new Date()) {
                const d = new Date(date);
                const day = d.getDay(); // 0 = 周日, 1 = 周一 ... 6 = 周六
                const diff = (day === 0 ? 6 : day - 1); // 到周一的天数差
                const monday = new Date(d);
                monday.setDate(d.getDate() - diff);
                monday.setHours(0, 0, 0, 0);
                return monday;
            }

            // 格式化日期为 M/D
            function formatDate(d) {
                return `${d.getMonth() + 1}/${d.getDate()}`;
            }

            // ---------- 状态管理 ----------
            // 18楼状态
            let baseMonday18 = getMonday(new Date());
            let baseName18 = DEFAULT_BASE_18;

            // 女厕所状态
            let baseMondayToilet = getMonday(new Date());
            let baseNameToilet = DEFAULT_BASE_TOILET;

            // DOM 元素
            const duty18NameEl = document.getElementById('duty18Name');
            const weekLabel18El = document.getElementById('weekLabel18');
            const sequence18El = document.getElementById('sequence18');
            const resetBtn18 = document.getElementById('resetBtn18');
            const resetHint18 = document.getElementById('resetHint18');

            const dutyToiletNameEl = document.getElementById('dutyToiletName');
            const weekLabelToiletEl = document.getElementById('weekLabelToilet');
            const sequenceToiletEl = document.getElementById('sequenceToilet');
            const resetBtnToilet = document.getElementById('resetBtnToilet');
            const resetHintToilet = document.getElementById('resetHintToilet');

            // ---------- 核心计算 ----------
            // 计算指定排班在当前周的值日生
            function getCurrentDuty(NAMES, baseName, baseMonday) {
                const currentMonday = getMonday(new Date());
                const diffTime = currentMonday - baseMonday;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                const weekOffset = Math.round(diffDays / 7);
                const baseIndex = NAMES.indexOf(baseName);
                if (baseIndex === -1) {
                    console.warn('基准人不在名单中，使用默认第一个');
                    return NAMES[0];
                }
                const len = NAMES.length;
                const currentIndex = ((baseIndex + weekOffset) % len + len) % len;
                return NAMES[currentIndex];
            }

            // 渲染18楼
            function render18() {
                const currentDuty = getCurrentDuty(NAMES_18, baseName18, baseMonday18);
                duty18NameEl.textContent = currentDuty;

                // 周标签
                const monday = getMonday(new Date());
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                weekLabel18El.textContent = `本周 ${formatDate(monday)} - ${formatDate(sunday)}`;

                // 循环顺序展示
                let seqHtml = '';
                NAMES_18.forEach((name, idx) => {
                    const isCurrent = (name === currentDuty);
                    seqHtml += `<div class="seq-item ${isCurrent ? 'current' : ''}">${name}</div>`;
                    if (idx < NAMES_18.length - 1) {
                        seqHtml += `<div class="arrow">→</div>`;
                    }
                });
                seqHtml += `<div class="arrow">↻</div>`;
                sequence18El.innerHTML = seqHtml;

                resetHint18.textContent = `基准: ${baseName18}`;
            }

            // 渲染女厕所
            function renderToilet() {
                const currentDuty = getCurrentDuty(NAMES_TOILET, baseNameToilet, baseMondayToilet);
                dutyToiletNameEl.textContent = currentDuty;

                // 周标签
                const monday = getMonday(new Date());
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                weekLabelToiletEl.textContent = `本周 ${formatDate(monday)} - ${formatDate(sunday)}`;

                // 循环顺序展示
                let seqHtml = '';
                NAMES_TOILET.forEach((name, idx) => {
                    const isCurrent = (name === currentDuty);
                    seqHtml += `<div class="seq-item ${isCurrent ? 'current' : ''}">${name}</div>`;
                    if (idx < NAMES_TOILET.length - 1) {
                        seqHtml += `<div class="arrow">→</div>`;
                    }
                });
                seqHtml += `<div class="arrow">↻</div>`;
                sequenceToiletEl.innerHTML = seqHtml;

                resetHintToilet.textContent = `基准: ${baseNameToilet}`;
            }

            // 整体渲染
            function renderAll() {
                render18();
                renderToilet();
            }

            // ---------- 重置功能 ----------
            function resetDuty(NAMES, defaultBaseName, setBaseName, setBaseMonday, renderFn) {
                const promptText = `请输入本周值日生姓名 (重置基准):\n${NAMES.map((n, i) => `${i + 1}. ${n}`).join('\n')}\n\n直接输入姓名或序号 (1-${NAMES.length})`;
                const userInput = prompt(promptText, defaultBaseName);
                if (userInput === null) return;

                let selectedName = null;
                const trimmed = userInput.trim();
                const num = parseInt(trimmed, 10);
                if (!isNaN(num) && num >= 1 && num <= NAMES.length) {
                    selectedName = NAMES[num - 1];
                } else {
                    const found = NAMES.find(n => n === trimmed);
                    if (found) selectedName = found;
                }

                if (!selectedName) {
                    alert('输入无效，请输入正确的姓名或序号。');
                    return;
                }

                // 更新状态
                setBaseName(selectedName);
                setBaseMonday(getMonday(new Date()));
                // 重新渲染对应排班
                renderFn();
            }

            // ---------- 初始化 ----------
            function init() {
                // 初始化基准周（都是本周）
                baseMonday18 = getMonday(new Date());
                baseName18 = DEFAULT_BASE_18;

                baseMondayToilet = getMonday(new Date());
                baseNameToilet = DEFAULT_BASE_TOILET;

                // 首次渲染
                renderAll();

                // 绑定重置事件 - 18楼
                resetBtn18.addEventListener('click', function() {
                    resetDuty(
                        NAMES_18,
                        baseName18,
                        (name) => { baseName18 = name; },
                        (monday) => { baseMonday18 = monday; },
                        render18
                    );
                });

                // 绑定重置事件 - 女厕所
                resetBtnToilet.addEventListener('click', function() {
                    resetDuty(
                        NAMES_TOILET,
                        baseNameToilet,
                        (name) => { baseNameToilet = name; },
                        (monday) => { baseMondayToilet = monday; },
                        renderToilet
                    );
                });

                // 每30分钟重新渲染，处理跨周情况
                setInterval(() => {
                    renderAll();
                }, 30 * 60 * 1000);
            }

            init();
        })();
    </script>
</body>
</html>
